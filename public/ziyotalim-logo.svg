<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500" fill="none">
  <defs>
    <linearGradient id="capGrad" x1="100" y1="50" x2="400" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B2B63" />
      <stop offset="100%" stop-color="#003580" />
    </linearGradient>

    <linearGradient id="zGrad" x1="150" y1="140" x2="350" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0080FF" />
      <stop offset="100%" stop-color="#0052CC" />
    </linearGradient>

    <linearGradient id="orangeGrad" x1="100" y1="230" x2="400" y2="330" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFB300" />
      <stop offset="100%" stop-color="#FF7700" />
    </linearGradient>

    <linearGradient id="navyBookGrad" x1="80" y1="280" x2="420" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#07204A" />
      <stop offset="100%" stop-color="#0B2B63" />
    </linearGradient>

    <filter id="logoShadow" x="-10%" y="-10%" width="120%" height="120%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.18" />
    </filter>
  </defs>

  <g filter="url(#logoShadow)">
    {/* Academic graduation cap */}
    <path d="M175 125 C175 160 325 160 325 125 L320 115 C305 138 195 138 180 115 Z" fill="#061C40" />
    <polygon points="250,55 405,118 250,172 95,118" fill="url(#capGrad)" stroke="#082250" stroke-width="3" stroke-linejoin="round" />
    <circle cx="250" cy="118" r="8" fill="#0052CC" stroke="#FFFFFF" stroke-width="2.5" />
    <path d="M250 118 Q360 128 380 170" stroke="#003580" stroke-width="6" stroke-linecap="round" fill="none" />
    <path d="M375 168 C368 185 368 215 372 235 C380 235 388 235 392 235 C392 215 390 185 385 168 Z" fill="#0B2B63" stroke="#003580" stroke-width="1.5" />

    {/* The stylized electric blue "Z" */}
    <path d="M165 178 L335 178 C342 178 346 186 341 192 L230 300 L345 300 C352 300 356 308 350 316 L335 330 C331 334 325 336 320 336 L155 336 C148 336 144 328 149 320 L260 212 L160 212 C152 212 148 204 154 196 L165 178 Z" fill="url(#zGrad)" stroke="#0040A8" stroke-width="2.5" stroke-linejoin="round" />
    <polygon points="285,212 338,212 285,268" fill="url(#orangeGrad)" />

    {/* Open book base */}
    <path d="M250 332 Q185 272 108 288 Q185 240 250 292 Z" fill="url(#orangeGrad)" />
    <path d="M250 332 Q315 272 392 288 Q315 240 250 292 Z" fill="url(#orangeGrad)" />
    <path d="M250 358 Q175 305 85 320 Q170 268 250 322 Z" fill="url(#navyBookGrad)" stroke="#051530" stroke-width="2" />
    <path d="M250 358 Q325 305 415 320 Q330 268 250 322 Z" fill="url(#navyBookGrad)" stroke="#051530" stroke-width="2" />
    <path d="M245 322 L250 366 L255 322 Z" fill="#051633" />
  </g>
</svg>
